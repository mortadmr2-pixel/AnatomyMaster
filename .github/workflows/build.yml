name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: unzip -o AnatomyMaster_FINAL_Android.zip

      - name: Print Broken Lines Only
        run: |
          FILE="app/src/main/java/com/example/anatomymaster/MainActivity.kt"
          echo "=== 1. Check Line 335 to 355 ==="
          nl -ba "$FILE" | sed -n '335,355p'

          echo "=== 2. Check Line 425 to 450 ==="
          nl -ba "$FILE" | sed -n '425,450p'

          echo "=== 3. Check Line 510 to 525 ==="
          nl -ba "$FILE" | sed -n '510,525p'
