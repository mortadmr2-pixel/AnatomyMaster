name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: unzip -o AnatomyMaster_FINAL_Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Patch and Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          python3 - << 'EOF'
          import re

          file_path = "app/src/main/java/com/example/anatomymaster/MainActivity.kt"
          with open(file_path, "r", encoding="utf-8") as f:
              code = f.read()

          # 1. تصحيح ترويسة الملف والاستيرادات
          if "@file:OptIn" not in code:
              code = "@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\n" + code
          
          if "import androidx.compose.foundation.lazy.items" not in code:
              code = code.replace("package com.example.anatomymaster", "package com.example.anatomymaster\n\nimport androidx.compose.foundation.lazy.items", 1)

          # 2. إزالة القوس الزائد قبل @Composable fun Home
          code = re.sub(r'(\}\s*)+\n+@Composable\s+fun Home', '}\n}\n}\n\n@Composable\nfun Home', code)

          # 3. تصحيح وسائط NavigationBarItem
          code = re.sub(r'NavigationBarItem\(\s*true\s*,\s*\{\s*\}\s*,\s*\{\s*\}\s*,', 'NavigationBarItem(selected = true, onClick = {},', code)
          code = re.sub(r'NavigationBarItem\(\s*false\s*,\s*\{\s*\}\s*,\s*onQuiz\s*,', 'NavigationBarItem(selected = false, onClick = onQuiz,', code)
          code = re.sub(r'NavigationBarItem\(\s*false\s*,\s*\{\s*\}\s*,\s*onProgress\s*,', 'NavigationBarItem(selected = false, onClick = onProgress,', code)

          # 4. تصحيح القوس الزائد قبل fun iconFor
          code = re.sub(r'(\}\s*)+\n+fun iconFor', '}\n}\n}\n}\n\nfun iconFor', code)

          # 5. تصحيح استدعاء onClick في شاشة Quiz
          code = re.sub(r'\{\s*if\s*\(selected\s*==\s*null\)\s*\{\{.*?\}\}\s*else\s*\{\{\}\}\s*\}', '{ if (selected == null) { selected = i; if (i == q.answer) score++ } }', code)

          with open(file_path, "w", encoding="utf-8") as f:
              f.write(code)
          print("Patched via Regex successfully")
          EOF

          echo "org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC" > gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          
          # تشغيل التجميع وتمرير السجل في حالة الفشل لعرض سطر الخطأ مباشرة
          ./gradlew assembleDebug --no-daemon --stacktrace || {
              echo "=== BUILD LOG ERROR SUMMARY ==="
              ./gradlew compileDebugKotlin --no-daemon 2>&1 | grep -E "e: |error: " | head -n 30
              exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AnatomyMaster-APK
          path: app/build/outputs/apk/debug/*.apk
