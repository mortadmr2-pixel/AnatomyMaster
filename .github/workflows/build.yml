name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: unzip -o AnatomyMaster_FINAL_Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Pinpoint Exact Compiler Errors
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

          echo "=============================================="
          echo ">>> RUNNING BUILD AND EXTRACTING ERRORS <<<"
          echo "=============================================="

          # تشغيل وتخزين السجل واستخراج رسائل الخطأ الصريحة فقط
          ./gradlew compileDebugKotlin > build_log.txt 2>&1 || true

          echo "----------------- EXACT ERRORS FOUND -----------------"
          grep -E "(e: |error:|FAILED|Exception)" build_log.txt || tail -n 60 build_log.txt
          echo "------------------------------------------------------"
