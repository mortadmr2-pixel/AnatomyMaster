name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: unzip -o AnatomyMaster_FINAL_Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Auto Download Icon & Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # تنزيل وضبط أيقونة الهيكل العظمي تلقائياً
          python3 - << 'EOF'
          import urllib.request
          import os
          from PIL import Image

          # رابط مباشر لتحميل نفس صورة الهيكل والقفص الصدري
          url = "https://images.fineartamerica.com/images/artworkimages/mediumlarge/3/futuristic-human-skeleton-and-rib-cage-digital-anatomy-mark-taylor.jpg"
          try:
              headers = {'User-Agent': 'Mozilla/5.0'}
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp, open("icon_temp.jpg", 'wb') as out:
                  out.write(resp.read())
              
              img = Image.open("icon_temp.jpg").convert("RGBA")
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192
              }
              for folder, sz in sizes.items():
                  path = os.path.join("app/src/main/res", folder)
                  os.makedirs(path, exist_ok=True)
                  res = img.resize((sz, sz), Image.Resampling.LANCZOS)
                  res.save(os.path.join(path, "ic_launcher.png"), "PNG")
                  res.save(os.path.join(path, "ic_launcher_round.png"), "PNG")
              print("Icon downloaded and applied successfully!")
          except Exception as e:
              print("Error applying icon:", e)
          EOF

          # الحفاظ على إعدادات البناء الناجحة
          echo "org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC" > gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AnatomyMaster-APK
          path: app/build/outputs/apk/debug/*.apk
