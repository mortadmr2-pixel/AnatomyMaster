name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: unzip -o AnatomyMaster_FINAL_Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Auto-Fix Configuration and Build
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # تصحيح إعدادات compileSdk و targetSdk
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 35/g' app/build.gradle.kts
            sed -i 's/targetSdk = [0-9]*/targetSdk = 35/g' app/build.gradle.kts
          fi

          # تعطيل قيود التحديثات الإجبارية للتبعيات
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties

          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug -x lint -x test --continue --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnatomyMaster-APK
          path: app/build/outputs/apk/debug/*.apk
