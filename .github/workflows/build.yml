name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: unzip -o AnatomyMaster_FINAL_Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Rebuild Architecture from Scratch
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

          find . -name "build.gradle*" -exec sed -i 's/compileSdk = [0-9]*/compileSdk = 35/g' {} +
          find . -name "build.gradle*" -exec sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/g' {} +
          find . -name "build.gradle*" -exec sed -i 's/targetSdk = [0-9]*/targetSdk = 35/g' {} +
          find . -name "build.gradle*" -exec sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 35/g' {} +

          mkdir -p app/src/main/assets
          if [ ! -f "app/src/main/assets/snell_anatomy.pdf" ]; then
            echo "Fetching Snell PDF..."
            curl -L -o app/src/main/assets/snell_anatomy.pdf "https://github.com/mortadmr2-pixel/AnatomyMaster/releases/download/V1.0/SNELL.S.CLINICAL.ANATOMY.BY.REGIONS.10th.Edition.pdf"
          fi

          # حذف أي ملف MainActivity قديم واستبداله بالتصميم الجديد كلياً
          find app/src/main/java -name "MainActivity.kt" -delete
          mkdir -p app/src/main/java/com/example/anatomymaster

          cat << 'EOF' > app/src/main/java/com/example/anatomymaster/MainActivity.kt
          package com.example.anatomymaster

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.pdf.PdfRenderer
          import android.os.Bundle
          import android.os.ParcelFileDescriptor
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.animation.*
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.ExperimentalFoundationApi
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.gestures.rememberTransformableState
          import androidx.compose.foundation.gestures.transformable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.pager.HorizontalPager
          import androidx.compose.foundation.pager.rememberPagerState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.graphics.graphicsLayer
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.launch
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          SnellMasterNewExperience()
                      }
                  }
              }
          }

          data class PenStroke(val offset: Offset, val color: Color, val radius: Float)

          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          fun SnellMasterNewExperience() {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("snell_prefs_v3", Context.MODE_PRIVATE) }
              val scope = rememberCoroutineScope()

              var pdfRenderer by remember { mutableStateOf<PdfRenderer?>(null) }
              var totalPages by remember { mutableStateOf(2063) }
              val pagerState = rememberPagerState(initialPage = 210, pageCount = { totalPages })

              var showControls by remember { mutableStateOf(true) }
              var showIndexSheet by remember { mutableStateOf(false) }
              var isHighlighterActive by remember { mutableStateOf(false) }
              var activeColor by remember { mutableStateOf(Color(0x80FBBF24)) }
              var showQuizDialog by remember { mutableStateOf(false) }

              val annotations = remember { mutableStateMapOf<Int, MutableList<PenStroke>>() }

              LaunchedEffect(Unit) {
                  try {
                      val file = File(context.cacheDir, "snell_anatomy.pdf")
                      if (!file.exists()) {
                          context.assets.open("snell_anatomy.pdf").use { input ->
                              FileOutputStream(file).use { output -> input.copyTo(output) }
                          }
                      }
                      val pfd = ParcelFileDescriptor.open(file, ParcelFileDescriptor.MODE_READ_ONLY)
                      val renderer = PdfRenderer(pfd)
                      pdfRenderer = renderer
                      totalPages = renderer.pageCount
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF020617))
              ) {
                  // تصفح أفقي بالسحب مثل تطبيقات الكتب العالمية
                  HorizontalPager(
                      state = pagerState,
                      modifier = Modifier.fillMaxSize(),
                      userScrollEnabled = !isHighlighterActive
                  ) { pageIndex ->
                      var pageBitmap by remember { mutableStateOf<Bitmap?>(null) }
                      var zoomScale by remember { mutableStateOf(1f) }
                      var panOffset by remember { mutableStateOf(Offset.Zero) }

                      val transformState = rememberTransformableState { zoomChange, offsetChange, _ ->
                          zoomScale = (zoomScale * zoomChange).coerceIn(1f, 5f)
                          if (zoomScale > 1f) panOffset += offsetChange else panOffset = Offset.Zero
                      }

                      LaunchedEffect(pageIndex, pdfRenderer) {
                          pdfRenderer?.let { renderer ->
                              if (pageIndex in 0 until renderer.pageCount) {
                                  val page = renderer.openPage(pageIndex)
                                  val bmp = Bitmap.createBitmap(page.width, page.height, Bitmap.Config.ARGB_8888)
                                  page.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)
                                  page.close()
                                  pageBitmap = bmp
                              }
                          }
                      }

                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .transformable(state = transformState, enabled = !isHighlighterActive)
                              .pointerInput(isHighlighterActive, pageIndex) {
                                  if (isHighlighterActive) {
                                      detectDragGestures { change, _ ->
                                          change.consume()
                                          val list = annotations.getOrPut(pageIndex) { mutableListOf() }
                                          list.add(PenStroke(change.position, activeColor, 15f))
                                          val data = list.takeLast(250).joinToString(";") {
                                              "${it.offset.x},${it.offset.y},${activeColor.value.toInt()}"
                                          }
                                          prefs.edit().putString("p_$pageIndex", data).apply()
                                      }
                                  } else {
                                      detectTapGestures(
                                          onDoubleTap = {
                                              zoomScale = if (zoomScale > 1.2f) 1f else 2.5f
                                              panOffset = Offset.Zero
                                          },
                                          onTap = {
                                              showControls = !showControls
                                          }
                                      )
                                  }
                              },
                          contentAlignment = Alignment.Center
                      ) {
                          if (pageBitmap != null) {
                              Box(
                                  modifier = Modifier
                                      .fillMaxSize()
                                      .graphicsLayer(
                                          scaleX = zoomScale,
                                          scaleY = zoomScale,
                                          translationX = panOffset.x,
                                          translationY = panOffset.y
                                      ),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Image(
                                      bitmap = pageBitmap!!.asImageBitmap(),
                                      contentDescription = null,
                                      modifier = Modifier.fillMaxWidth()
                                  )

                                  Canvas(modifier = Modifier.matchParentSize()) {
                                      annotations[pageIndex]?.forEach { stroke ->
                                          drawCircle(
                                              color = stroke.color,
                                              radius = stroke.radius,
                                              center = stroke.offset
                                          )
                                      }
                                  }
                              }
                          } else {
                              CircularProgressIndicator(color = Color(0xFF38BDF8), strokeWidth = 3.dp)
                          }
                      }
                  }

                  // شريط تحكم عائم ذكي بتصميم كبسولة زجاجية (Floating Minimal Pill)
                  AnimatedVisibility(
                      visible = showControls,
                      enter = fadeIn() + slideInVertically(initialOffsetY = { it }),
                      exit = fadeOut() + slideOutVertically(targetOffsetY = { it }),
                      modifier = Modifier
                          .align(Alignment.BottomCenter)
                          .padding(bottom = 24.dp)
                  ) {
                      Row(
                          modifier = Modifier
                              .clip(RoundedCornerShape(32.dp))
                              .background(Color(0xE60F172A))
                              .border(1.dp, Color(0xFF334155), RoundedCornerShape(32.dp))
                              .padding(horizontal = 16.dp, vertical = 8.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(12.dp)
                      ) {
                          Text(
                              text = "${pagerState.currentPage + 1} / $totalPages",
                              color = Color(0xFF38BDF8),
                              fontWeight = FontWeight.Bold,
                              fontSize = 13.sp,
                              modifier = Modifier.padding(horizontal = 6.dp)
                          )

                          IconButton(
                              onClick = { showIndexSheet = true },
                              modifier = Modifier.size(40.dp)
                          ) {
                              Text("📑", fontSize = 18.sp)
                          }

                          IconButton(
                              onClick = { isHighlighterActive = !isHighlighterActive },
                              modifier = Modifier
                                  .size(40.dp)
                                  .background(
                                      if (isHighlighterActive) Color(0xFF38BDF8).copy(alpha = 0.3f) else Color.Transparent,
                                      CircleShape
                                  )
                          ) {
                              Text("✏️", fontSize = 18.sp)
                          }

                          IconButton(
                              onClick = { showQuizDialog = true },
                              modifier = Modifier.size(40.dp)
                          ) {
                              Text("🩺", fontSize = 18.sp)
                          }
                      }
                  }

                  // نافذة الفصول المنبثقة
                  if (showIndexSheet) {
                      val chapters = listOf(
                          "Ch 1: Introduction & Tissues" to 1,
                          "Ch 2: Thorax - Wall & Pleura" to 45,
                          "Ch 3: Thorax - Heart & Lungs" to 110,
                          "Ch 4: Abdomen - Anterior Wall" to 195,
                          "Ch 5: Abdomen - Viscera" to 280,
                          "Ch 6: Pelvis & Perineum" to 380,
                          "Ch 7: Upper Limb" to 490,
                          "Ch 8: Lower Limb" to 630,
                          "Ch 9: Head & Neck" to 770
                      )
                      Card(
                          modifier = Modifier
                              .align(Alignment.Center)
                              .padding(24.dp)
                              .fillMaxWidth(0.85f),
                          shape = RoundedCornerShape(20.dp),
                          colors = CardDefaults.cardColors(containerColor = Color(0xF20F172A))
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("Snell Regional Index", color = Color(0xFF38BDF8), fontWeight = FontWeight.Bold, fontSize = 16.sp)
                              Spacer(modifier = Modifier.height(10.dp))
                              LazyColumn(modifier = Modifier.height(300.dp)) {
                                  items(chapters) { ch ->
                                      Text(
                                          text = ch.first,
                                          color = Color.White,
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .clickable {
                                                  scope.launch {
                                                      pagerState.scrollToPage(ch.second)
                                                      showIndexSheet = false
                                                  }
                                              }
                                              .padding(vertical = 12.dp, horizontal = 8.dp),
                                          fontSize = 14.sp
                                      )
                                      Divider(color = Color(0xFF1E293B))
                                  }
                              }
                          }
                      }
                  }

                  // نافذة الكويزات السريرية
                  if (showQuizDialog) {
                      AlertDialog(
                          onDismissRequest = { showQuizDialog = false },
                          confirmButton = {
                              Button(
                                  onClick = { showQuizDialog = false },
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0284C7))
                              ) {
                                  Text("Close", color = Color.White)
                              }
                          },
                          title = { Text("Clinical Vignette", color = Color(0xFF38BDF8), fontWeight = FontWeight.Bold) },
                          text = {
                              Column {
                                  Text(
                                      "A patient suffers a fracture of the fibular neck resulting in Foot Drop. Which nerve is injured?",
                                      color = Color.White,
                                      fontSize = 14.sp
                                  )
                                  Spacer(modifier = Modifier.height(12.dp))
                                  Text(
                                      "💡 Answer: Common Fibular (Peroneal) Nerve.\nIt winds subcutaneously around the neck of the fibula, making it vulnerable to trauma.",
                                      color = Color(0xFF94A3B8),
                                      fontSize = 13.sp
                                  )
                              }
                          },
                          containerColor = Color(0xFF0F172A),
                          shape = RoundedCornerShape(16.dp)
                      )
                  }
              }
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC" > gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload New Architectural APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AnatomyMaster-New-Architecture-APK
          path: app/build/outputs/apk/debug/*.apk
