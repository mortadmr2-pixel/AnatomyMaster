name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: unzip -o AnatomyMaster_FINAL_Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Detailed Error Diagnostic & Build
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # تنزيل ملف Snell إذا لم يكن موجوداً
          mkdir -p app/src/main/assets
          if [ ! -f "app/src/main/assets/snell_anatomy.pdf" ]; then
            echo "Downloading Snell PDF..."
            curl -L -o app/src/main/assets/snell_anatomy.pdf "https://github.com/mortadmr2-pixel/AnatomyMaster/releases/download/V1.0/SNELL.S.CLINICAL.ANATOMY.BY.REGIONS.10th.Edition.pdf"
          fi

          # توليد الـ wrapper
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

          echo "=========================================================="
          echo ">>> STARTING DETAILED COMPILATION DIAGNOSTIC <<<"
          echo "=========================================================="

          # تشغيل الكومبايلر مع إظهار أرقام الأسطر والخطأ بالتفصيل
          ./gradlew compileDebugKotlin --stacktrace --info || true

          echo "=========================================================="
          echo ">>> RUNNING FULL ASSEMBLE WITH DETAILED LOGS <<<"
          echo "=========================================================="
          ./gradlew assembleDebug --stacktrace
