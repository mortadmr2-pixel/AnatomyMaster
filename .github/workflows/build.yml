name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: unzip -o AnatomyMaster_FINAL_Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Auto-Fix Configuration and Build
        run: |
          echo "=== 1. قبول كل رخص أندرويد تلقائياً ==="
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          echo "=== 2. تصحيح ملفات Gradle تلقائياً ==="
          # رفع compileSdk و targetSdk إلى 35 في ملف app/build.gradle.kts إذا كان أقل
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 35/g' app/build.gradle.kts
            sed -i 's/targetSdk = [0-9]*/targetSdk = 35/g' app/build.gradle.kts
          fi

          echo "=== 3. توليد الـ Gradle Wrapper وضبط الصلاحيات ==="
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

          echo "=== 4. بناء الـ APK ==="
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnatomyMaster-APK
          path: app/build/outputs/apk/debug/*.apk
