name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: unzip -o AnatomyMaster_FINAL_Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Accept Licenses and Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --warning-mode=none --quiet || ./gradlew assembleDebug --stacktrace | grep -E "FAILURE|What went wrong|Caused by:" -A 5

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnatomyMaster-APK
          path: app/build/outputs/apk/debug/*.apk
