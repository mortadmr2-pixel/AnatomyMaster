name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: unzip -o AnatomyMaster_FINAL_Android.zip

      - name: Print Broken Code
        run: |
          FILE="app/src/main/java/com/example/anatomymaster/MainActivity.kt"
          echo "===== SECTION 1 (Lines 330-360) ====="
          sed -n '330,360p' "$FILE"
          echo "===== SECTION 2 (Lines 420-460) ====="
          sed -n '420,460p' "$FILE"
          echo "===== SECTION 3 (Lines 505-530) ====="
          sed -n '505,530p' "$FILE"
