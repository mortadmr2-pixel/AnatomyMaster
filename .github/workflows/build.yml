name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: unzip -o AnatomyMaster_FINAL_Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Auto-Fix Experimental APIs and Build
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # تجاوز فحوصات JVM
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

          # تفعيل السماح بالميزات التجريبية لـ Material3 داخل ملفات Kotlin
          MAIN_KT="app/src/main/java/com/example/anatomymaster/MainActivity.kt"
          if [ -f "$MAIN_KT" ]; then
            sed -i '1s/^/@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\n/' "$MAIN_KT"
          fi

          # إيقاف معاملة التحذيرات كأخطاء في تجميع كوتلن
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 35/g' app/build.gradle.kts
            sed -i 's/targetSdk = [0-9]*/targetSdk = 35/g' app/build.gradle.kts
            sed -i '/defaultConfig {/a \        multiDexEnabled = true' app/build.gradle.kts
            echo 'tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach { kotlinOptions { allWarningsAsErrors = false; freeCompilerArgs += listOf("-opt-in=androidx.compose.material3.ExperimentalMaterial3Api") } }' >> app/build.gradle.kts
          fi

          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug -Pkotlin.jvm.target.validation.mode=warning --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnatomyMaster-APK
          path: app/build/outputs/apk/debug/*.apk
