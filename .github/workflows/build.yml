name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: unzip -o AnatomyMaster_FINAL_Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Show Kotlin Error Details
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          echo "org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC" > gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

          # تشغيل التجميع وتخزين التقرير بالكامل
          ./gradlew compileDebugKotlin --no-daemon > build_errors.log 2>&1 || true

          echo "==================== KOTLIN ERRORS START ===================="
          grep -E "e: |error: |Unresolved reference" build_errors.log | head -n 30 || cat build_errors.log | tail -n 40
          echo "==================== KOTLIN ERRORS END ===================="

      - name: Upload Error Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kotlin-Build-Errors
          path: build_errors.log
