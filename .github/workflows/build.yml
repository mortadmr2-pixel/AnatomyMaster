name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: unzip -o AnatomyMaster_FINAL_Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Print Exact Kotlin Errors and Build
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          echo "org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC" > gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

          # تشغيل البناء واستخراج أسطر الخطأ البرمجي الدقيقة
          ./gradlew compileDebugKotlin --no-daemon 2>&1 | tee compile_log.txt || true
          echo "==================== KOTLIN ERRORS ===================="
          grep -E "e: |error:" compile_log.txt | head -n 20

      - name: Upload Compile Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kotlin-Compile-Log
          path: compile_log.txt
