name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o AnatomyMaster_FINAL_Android.zip
          # البحث التلقائي عن مجلد المشروع الذي يحتوي على gradlew ونقل محتوياته للمسار الرئيسي
          GRADLE_DIR=$(dirname $(find . -maxdepth 3 -name "gradlew" | head -n 1))
          if [ -n "$GRADLE_DIR" ] && [ "$GRADLE_DIR" != "." ]; then
            echo "Moving files from $GRADLE_DIR to root..."
            cp -r $GRADLE_DIR/* .
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnatomyMaster-APK
          path: app/build/outputs/apk/debug/*.apk
