name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: unzip -o AnatomyMaster_FINAL_Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Patch and Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          python3 - << 'EOF'
          file_path = "app/src/main/java/com/example/anatomymaster/MainActivity.kt"
          with open(file_path, "r", encoding="utf-8") as f:
              code = f.read()

          # إجبار الاستيرادات في بداية الملف
          imports = """@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)
          package com.example.anatomymaster

          import androidx.compose.foundation.lazy.items
          import androidx.compose.runtime.Composable
          import androidx.compose.material3.Text
          """
          code = code.replace("package com.example.anatomymaster", imports, 1)

          # إصلاح استدعاءات NavigationBarItem
          code = code.replace("NavigationBarItem(true, {}, {}, icon=", "NavigationBarItem(selected = true, onClick = {}, icon=")
          code = code.replace("NavigationBarItem(false, {}, onQuiz, icon=", "NavigationBarItem(selected = false, onClick = onQuiz, icon=")
          code = code.replace("NavigationBarItem(false, {}, onProgress, icon=", "NavigationBarItem(selected = false, onClick = onProgress, icon=")

          # إصلاح onClick في الـ Quiz
          code = code.replace("{if(selected==null) {{selected=i; if(i==q.answer) score++}} else {{}}}", "{ if(selected==null) { selected=i; if(i==q.answer) score++ } }")

          # إزالة الأقواس الزائدة
          code = code.replace("}\n}\n}\n}\n\n@Composable\nfun Home", "}\n}\n}\n\n@Composable\nfun Home")
          code = code.replace("}\n}\n}\n}\n}\n\nfun iconFor", "}\n}\n}\n}\n\nfun iconFor")

          # إضافة الشاشات المفقودة في نهاية الملف لمنع خطأ Unresolved reference
          missing_screens = """

          @Composable
          fun StudyChapterScreen(onBack: () -> Unit = {}) {
              Text("Study Chapters")
          }

          @Composable
          fun FinalDashboard(onBack: () -> Unit = {}, onExam: () -> Unit = {}, onRegions: () -> Unit = {}, onFlashcards: () -> Unit = {}) {
              Text("Final Dashboard")
          }
          """
          code = code + missing_screens

          with open(file_path, "w", encoding="utf-8") as f:
              f.write(code)
          print("Patched successfully!")
          EOF

          echo "org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC" > gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AnatomyMaster-APK
          path: app/build/outputs/apk/debug/*.apk
